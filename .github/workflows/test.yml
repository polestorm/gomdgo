name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go: ["1.22", "stable"]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)"
      - name: no dependencies in the library module
        if: matrix.os == 'ubuntu-latest'
        run: "! grep -q '^require' go.mod"
      - run: go vet ./...
      - run: go test ./...
      - name: command with diagrams (separate module)
        working-directory: cmd/gomdgo-mermaid
        run: go vet . && go test .
      - name: comparison with other libraries (separate module)
        working-directory: tools/compare
        run: go vet ./... && go test ./...
